name: Weekly update

on:
  schedule:
    - cron: "0 2 * * 1"   # Mondays 09:00 Vietnam time (videos go up Thu & Sun 20:30)
  workflow_dispatch:
    inputs:
      test_withhold:
        description: "Dry run: re-process the N newest videos and write nothing (0 = real run)"
        default: "0"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U yt-dlp
      - run: python pipeline/update.py
        env:
          TEST_WITHHOLD: ${{ inputs.test_withhold || '0' }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js pipeline/seen.json pipeline/unresolved.md 2>/dev/null || git add data.js pipeline/seen.json
          git diff --cached --quiet || git commit -m "Weekly update: new videos" && git push
